<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Déclenchement d'un plan à périodicité : l'échéance est la clôture de la demande précédente plus la périodicité ; la ligne est À venir, puis Cette semaine dans les 7 jours de prévenance où la tâche quotidienne génère l'occurrence, puis En retard après l'échéance, avec une notification le lendemain puis chaque semaine ; Lancer en avance crée l'occurrence avant la prévenance</title>
  <style>
    text { font-size: 14px; fill: #1f2937; }
    .title { font-size: 16px; font-weight: 600; }
    .note { font-size: 12px; fill: #6b7280; }
    .axis { stroke: #475569; stroke-width: 2; }
    .arrow { stroke: #475569; stroke-width: 1.8; fill: none; marker-end: url(#head); }
    .violetarrow { stroke: #7c3aed; stroke-width: 1.8; fill: none; marker-end: url(#headviolet); }
    .ok { fill: #f8fafc; stroke: #475569; stroke-width: 1.5; }
    .soon { fill: #fffbeb; stroke: #d97706; stroke-width: 1.5; }
    .late { fill: #fef2f2; stroke: #dc2626; stroke-width: 1.5; stroke-dasharray: 5 3; }
    .violet { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 1.5; }
    .memo { fill: #f8fafc; stroke: #475569; stroke-width: 1; }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
    <marker id="headviolet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#7c3aed"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="899" height="379" rx="12" fill="#ffffff" stroke="#e2e2e3"/>

  <!-- Groupes de l'échéancier -->
  <text class="note" x="30" y="34">Groupe dans l'échéancier</text>
  <rect class="ok" x="60" y="44" width="440" height="34" rx="6"/>
  <text x="280" y="66" text-anchor="middle">À venir</text>
  <rect class="soon" x="500" y="44" width="160" height="34" rx="6"/>
  <text x="580" y="66" text-anchor="middle">Cette semaine</text>
  <rect class="late" x="660" y="44" width="210" height="34" rx="6"/>
  <text x="765" y="66" text-anchor="middle" style="fill:#dc2626">En retard (+N j)</text>

  <!-- Frise -->
  <line class="axis" x1="60" y1="130" x2="870" y2="130"/>
  <line class="axis" x1="60" y1="118" x2="60" y2="142"/>
  <line class="axis" x1="500" y1="118" x2="500" y2="142"/>
  <line class="axis" x1="660" y1="118" x2="660" y2="142"/>
  <path class="arrow" d="M64 106 H656"/>
  <text x="360" y="100" text-anchor="middle">périodicité du plan (jours)</text>
  <text x="580" y="122" text-anchor="middle" class="note">7 jours</text>

  <text x="30" y="164">référence</text>
  <text class="note" x="30" y="180">clôture de la</text>
  <text class="note" x="30" y="194">demande précédente</text>
  <text x="500" y="164" text-anchor="middle">échéance - 7 j</text>
  <text class="title" x="660" y="164" text-anchor="middle">échéance</text>

  <!-- Événements -->
  <rect class="violet" x="400" y="226" width="200" height="62" rx="10"/>
  <text x="500" y="250" text-anchor="middle">Tâche quotidienne (5 h)</text>
  <text class="note" x="500" y="268" text-anchor="middle">crée l'occurrence, sa demande</text>
  <text class="note" x="500" y="282" text-anchor="middle">et ses tâches</text>
  <path class="arrow" d="M500 224 V200"/>

  <rect class="violet" x="640" y="226" width="230" height="62" rx="10"/>
  <text x="755" y="250" text-anchor="middle">Notification de retard</text>
  <text class="note" x="755" y="268" text-anchor="middle">le lendemain de l'échéance,</text>
  <text class="note" x="755" y="282" text-anchor="middle">puis chaque semaine</text>
  <path class="arrow" d="M680 224 V200"/>

  <rect class="violet" x="150" y="226" width="200" height="62" rx="10"/>
  <text x="250" y="250" text-anchor="middle">Lancer en avance</text>
  <text class="note" x="250" y="268" text-anchor="middle">fiche équipement, à la main :</text>
  <text class="note" x="250" y="282" text-anchor="middle">occurrence créée tout de suite</text>
  <path class="violetarrow" d="M250 224 V200"/>

  <!-- Règles -->
  <rect class="memo" x="30" y="312" width="410" height="50" rx="6"/>
  <text x="44" y="333">Sans historique : l'échéance est aujourd'hui.</text>
  <text x="44" y="352">Plan par compteur d'heures : « Non calculé ».</text>
  <rect class="memo" x="460" y="312" width="410" height="50" rx="6"/>
  <text x="474" y="333">Occurrence en cours : la ligne garde sa date</text>
  <text x="474" y="352">prévue jusqu'à la clôture, puis l'échéance glisse.</text>
</svg>
