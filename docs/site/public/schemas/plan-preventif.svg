<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Un plan préventif : rattaché à une classe d'équipement, il vaut pour chaque machine de la classe ; il porte un déclencheur, le mode automatique ou manuel, et une gamme d'étapes ; chaque occurrence sur une machine crée une tâche par étape</title>
  <style>
    text { font-size: 14px; fill: #1f2937; }
    .title { font-size: 16px; font-weight: 600; }
    .note { font-size: 12px; fill: #6b7280; }
    .violet { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 1.5; }
    .sub { fill: #ffffff; stroke: #7c3aed; stroke-width: 1; }
    .opt { fill: #ffffff; stroke: #7c3aed; stroke-width: 1; stroke-dasharray: 4 3; }
    .grey { fill: #f8fafc; stroke: #475569; stroke-width: 1.5; }
    .machine { fill: #ffffff; stroke: #475569; stroke-width: 1; }
    .green { fill: #ecfdf5; stroke: #059669; stroke-width: 1.5; }
    .arrow { stroke: #475569; stroke-width: 1.8; fill: none; marker-end: url(#head); }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="899" height="399" rx="12" fill="#ffffff" stroke="#e2e2e3"/>

  <!-- Classe et ses machines -->
  <rect class="grey" x="30" y="30" width="230" height="200" rx="10"/>
  <text class="title" x="145" y="56" text-anchor="middle">Classe d'équipement</text>
  <text class="note" x="145" y="74" text-anchor="middle">par exemple : convoyeurs</text>
  <rect class="machine" x="55" y="88" width="180" height="30" rx="6"/>
  <text x="145" y="108" text-anchor="middle">Machine A</text>
  <rect class="machine" x="55" y="126" width="180" height="30" rx="6"/>
  <text x="145" y="146" text-anchor="middle">Machine B</text>
  <rect class="machine" x="55" y="164" width="180" height="30" rx="6"/>
  <text x="145" y="184" text-anchor="middle">Machine C</text>
  <text class="note" x="145" y="216" text-anchor="middle">le plan vaut pour chacune</text>

  <path class="arrow" d="M330 130 H262"/>
  <text class="note" x="296" y="120" text-anchor="middle">classe</text>

  <!-- Plan -->
  <rect class="violet" x="330" y="30" width="270" height="200" rx="10"/>
  <text class="title" x="465" y="56" text-anchor="middle">Plan</text>
  <text class="note" x="465" y="74" text-anchor="middle">code, libellé</text>
  <rect class="sub" x="350" y="88" width="230" height="44" rx="6"/>
  <text x="465" y="106" text-anchor="middle">Déclencheur</text>
  <text class="note" x="465" y="123" text-anchor="middle">jours, ou seuil d'heures</text>
  <rect class="sub" x="350" y="142" width="230" height="44" rx="6"/>
  <text x="465" y="160" text-anchor="middle">Auto ou Manuel</text>
  <text class="note" x="465" y="177" text-anchor="middle">Auto : sans validation</text>
  <text class="note" x="465" y="214" text-anchor="middle">Actif ou Inactif</text>

  <!-- Gamme -->
  <rect class="violet" x="640" y="30" width="230" height="200" rx="10"/>
  <text class="title" x="755" y="56" text-anchor="middle">Gamme</text>
  <text class="note" x="755" y="74" text-anchor="middle">propre au plan, ordonnée</text>
  <rect class="sub" x="660" y="88" width="190" height="30" rx="6"/>
  <text x="755" y="108" text-anchor="middle">1. Étape obligatoire</text>
  <rect class="sub" x="660" y="126" width="190" height="30" rx="6"/>
  <text x="755" y="146" text-anchor="middle">2. Étape obligatoire</text>
  <rect class="opt" x="660" y="164" width="190" height="30" rx="6"/>
  <text x="755" y="184" text-anchor="middle">3. Étape optionnelle</text>
  <path class="arrow" d="M600 130 H638"/>

  <!-- Occurrence -->
  <rect class="green" x="330" y="280" width="540" height="90" rx="10"/>
  <text class="title" x="350" y="306">Occurrence : un passage du plan sur une machine</text>
  <text x="350" y="330">Une demande d'intervention, puis une intervention préventive</text>
  <text x="350" y="352">avec une tâche par étape. L'étape obligatoire bloque la clôture.</text>
  <path class="arrow" d="M755 230 V278"/>
  <text class="note" x="765" y="258">une tâche par étape</text>
  <path class="arrow" d="M235 179 C 290 220, 290 300, 328 320"/>
  <text class="note" x="40" y="262">une seule occurrence en cours</text>
  <text class="note" x="40" y="278">à la fois par plan et par machine</text>
</svg>
