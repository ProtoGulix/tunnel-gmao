<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Une action au centre : ce qu'elle contient (temps, nature, complexité, technicien déclaré), ce qui la lie (tâches, intervention) et ce qu'elle alimente (historique de l'équipement, bilan, demandes d'achat)</title>
  <style>
    text { font-size: 14px; fill: #1f2937; }
    .title { font-size: 18px; font-weight: 600; }
    .note { font-size: 12px; fill: #6b7280; }
    .blue { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; }
    .green { fill: #ecfdf5; stroke: #059669; stroke-width: 1.5; }
    .orange { fill: #fffbeb; stroke: #d97706; stroke-width: 1.5; }
    .grey { fill: #f8fafc; stroke: #475569; stroke-width: 1.5; }
    .neutral { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .arrow { stroke: #475569; stroke-width: 1.8; fill: none; marker-end: url(#head); }
    .dots { stroke: #475569; stroke-width: 1.5; stroke-dasharray: 3 4; fill: none; }
    .rule { stroke: #a7d7c5; stroke-width: 1; }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="899" height="379" rx="12" fill="#ffffff" stroke="#e2e2e3"/>

  <!-- Action au centre -->
  <rect class="green" x="260" y="30" width="380" height="230" rx="12"/>
  <text class="title" x="450" y="64" text-anchor="middle">Action</text>
  <line class="rule" x1="280" y1="80" x2="620" y2="80"/>
  <text x="278" y="108">Temps : par quart d'heure, 0,25 h minimum</text>
  <text x="278" y="140">Nature : catégorie, puis sous-catégorie</text>
  <text x="278" y="172">Complexité : 1 à 10</text>
  <text x="278" y="204">Facteur de complexité : obligatoire au-delà de 5</text>
  <text x="278" y="236">Technicien déclaré (donnée libre)</text>

  <!-- Ce qui la lie -->
  <rect class="blue" x="20" y="70" width="140" height="50" rx="8"/>
  <text x="90" y="100" text-anchor="middle">Intervention</text>
  <path class="arrow" d="M160 95 H258"/>
  <text class="note" x="209" y="87" text-anchor="middle">appartient à</text>

  <rect class="green" x="20" y="150" width="140" height="50" rx="8"/>
  <text x="90" y="172" text-anchor="middle">Tâches</text>
  <text x="90" y="189" text-anchor="middle">(au moins une)</text>
  <path class="arrow" d="M160 175 H258"/>
  <text class="note" x="209" y="167" text-anchor="middle">fait avancer</text>

  <!-- Ce qu'elle alimente -->
  <rect class="neutral" x="740" y="45" width="140" height="50" rx="8"/>
  <text x="810" y="66" text-anchor="middle">Historique de</text>
  <text x="810" y="83" text-anchor="middle">l'équipement</text>
  <path class="arrow" d="M640 70 H738"/>

  <rect class="neutral" x="740" y="125" width="140" height="50" rx="8"/>
  <text x="810" y="155" text-anchor="middle">Bilan du service</text>
  <path class="arrow" d="M640 150 H738"/>

  <rect class="orange" x="740" y="205" width="140" height="50" rx="8"/>
  <text x="810" y="235" text-anchor="middle">Demande d'achat</text>
  <path class="arrow" d="M640 230 H738"/>
  <text class="note" x="694" y="209" text-anchor="middle">si une pièce</text>
  <text class="note" x="694" y="223" text-anchor="middle">manque</text>

  <!-- Auteur réel -->
  <path class="dots" d="M450 260 V298"/>
  <rect class="grey" x="260" y="298" width="380" height="54" rx="8"/>
  <text x="450" y="321" text-anchor="middle">Auteur réel : la personne connectée</text>
  <text x="450" y="339" text-anchor="middle">(journal d'audit)</text>
</svg>
